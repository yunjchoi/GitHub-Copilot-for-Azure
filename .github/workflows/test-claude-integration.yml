name: Foundry Live Claude Comparison - manual

on:
  workflow_dispatch:
    inputs:
      claude_secret_name:
        description: "Claude OAuth secret name in cideploytest"
        required: true
        default: "CLAUDE_CODE_OAUTH_TOKEN"
        type: string
      copilot_model:
        description: "Explicit Copilot model ID"
        required: true
        default: "claude-sonnet-5"
        type: string
      claude_model:
        description: "Explicit Claude model ID"
        required: true
        default: "claude-sonnet-5"
        type: string
      judge_model:
        description: "Copilot-supported grader model ID"
        required: true
        default: "gpt-5.5"
        type: string
      timeout:
        description: "Timeout for each client's single deployment trial"
        required: true
        default: "30m"
        type: choice
        options:
          - "30m"
          - "45m"

permissions:
  contents: read
  copilot-requests: write
  id-token: write

concurrency:
  group: foundry-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  eval:
    name: Foundry live comparison
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cideploytest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Validate Claude secret selection
        shell: bash
        env:
          CLAUDE_SECRET_NAME: ${{ inputs.claude_secret_name }}
        run: |
          set -euo pipefail
          if [[ ! "$CLAUDE_SECRET_NAME" =~ ^CLAUDE_CODE_OAUTH_TOKEN(_[A-Z0-9_]+)?$ ]]; then
            echo "claude_secret_name must be CLAUDE_CODE_OAUTH_TOKEN or a suffixed variant." >&2
            exit 2
          fi

      - name: Install azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2

      - name: Log in with azd using federated credentials
        shell: bash
        run: |
          AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify default Azure subscription
        shell: bash
        run: |
          set -euo pipefail
          default_subscription=$(az account show --query id --output tsv --only-show-errors)
          account_state=$(az account show --query state --output tsv --only-show-errors)
          if [[ "$default_subscription" != "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "Azure CLI default subscription does not match cideploytest AZURE_SUBSCRIPTION_ID." >&2
            exit 1
          fi
          if [[ "$account_state" != "Enabled" ]]; then
            echo "The cideploytest default subscription is not enabled." >&2
            exit 1
          fi
          echo "Using the cideploytest default Azure subscription."

      - name: Refresh Azure OIDC login every 240 seconds
        shell: bash
        run: |
          while true; do
            token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)
            az login --service-principal \
              --username "$AZURE_CLIENT_ID" \
              --tenant "$AZURE_TENANT_ID" \
              --federated-token "$token" \
              --output none
            sleep 240
          done &

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies and build skills
        run: |
          npm ci
          npm --prefix tests ci
          npm run build

      - name: Install Foundry azd extension
        shell: bash
        run: AZURE_DEV_USER_AGENT=microsoft_foundry_skill azd extension install microsoft.foundry

      - name: Install pinned Claude Code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.281
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CLAUDE_CLI_PATH=$HOME/.local/bin/claude" >> "$GITHUB_ENV"
          "$HOME/.local/bin/claude" --version

      - name: Build pinned Vally Claude executor
        shell: bash
        run: |
          set -euo pipefail
          VALLY_DIR="$RUNNER_TEMP/vally"
          git clone https://github.com/microsoft/vally.git "$VALLY_DIR"
          git -C "$VALLY_DIR" checkout 23ecce600f1eb4107593c82deb57682256312764
          npm --prefix "$VALLY_DIR" ci
          npm --prefix "$VALLY_DIR" run build --workspace @microsoft/vally-executor-claude-cli
          EXECUTOR_MODULE="$VALLY_DIR/plugins/executors/vally-executor-claude-cli/dist/index.js"
          test -f "$EXECUTOR_MODULE"
          echo "VALLY_CLAUDE_EXECUTOR_MODULE=$EXECUTOR_MODULE" >> "$GITHUB_ENV"

      - name: Setup Copilot CLI for graders
        uses: mvkaran/setup-copilot-cli@d05a47209e6b3185c9c55702bef49f28e6eebef7 # v1
        with:
          token: ${{ github.token }}

      - name: Run live Foundry comparison
        working-directory: tests
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[inputs.claude_secret_name] }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: ${{ inputs.copilot_model }}
          CLAUDE_MODEL: ${{ inputs.claude_model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          TRIAL_TIMEOUT: ${{ inputs.timeout }}
          MODEL_OVERRIDE: ""
          NO_SKILLS: ""
        run: |
          set -euo pipefail
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "The selected Claude OAuth secret is missing from cideploytest." >&2
            exit 2
          fi
          npm run compare:foundry-live -- \
            --execute \
            --copilot-model "$COPILOT_MODEL" \
            --claude-model "$CLAUDE_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --location northcentralus \
            --timeout "$TRIAL_TIMEOUT"

      - name: Add evaluation report to job summary
        if: always()
        shell: bash
        run: |
          REPORT=$(find tests/results-comparison -name comparison-report.md -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)
          if [[ -n "$REPORT" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No comparison-report.md was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/results-comparison/**/comparison-report.md
            tests/results-comparison/**/comparison-report.json
          if-no-files-found: warn
          retention-days: 14